# Test-infrastructure collection hardening (PYTEST_LIVE_SIDE_EFFECT_ISOLATION).
# Only collection scope is configured here; no addopts, markers or warning filters (test semantics unchanged).
# Bare `pytest` collects tests/ only; runtime/generated/venv/dot directories are never recursed.
[pytest]
testpaths = tests
norecursedirs =
    *.egg .* _darcs build CVS dist node_modules venv {arch}
    .venv .venv-* venv-*
    output outputs logs server-logs chapters models loras lora-training training-data
    .worktrees agent-tools __pycache__ pytest-of-* ea4e* sc7-src-* sc8x
    tmp temp tmp_* _tmp_* _trash-json runtime storage backup migration-backups *-backup
    ms-playwright graphify-out campaigns social-posts tiktok-posts tiktok-sound-bank youtube-videos
    story-hook-videos story-hook-inbox manual-video-packs experiment-post-packs image-lab
    promo-image-archive pinned-profile-assets-output qualification-evidence review-staging
    background-videos youtube-end-screen-debug chrome-helper chrome-helper-profile
