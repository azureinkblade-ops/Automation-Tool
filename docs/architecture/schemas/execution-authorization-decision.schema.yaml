schema: hermes.execution_authorization_decision
schema_version: "1.0"
status: proposed
description: >-
  Immutable GRANTED/DENIED decision artifact (EA-1 domain model). Does not issue
  the referenced authorization. Distinct from the other execution-authorization
  schemas.

required:
  - decision_id
  - request_id
  - task_id
  - decision_actor
  - outcome
  - decision_reason
  - authorization_policy
  - artifact_version
  - artifact_hash

fields:
  decision_id:
    type: string
  request_id:
    type: string
  task_id:
    type: string
  decision_actor:
    type: object
    required: [actor_id, actor_type, authority_role]
    fields:
      actor_id:
        type: string
      actor_type:
        type: string
        enum: [HUMAN, POLICY_SERVICE, SYSTEM]
      authority_role:
        type: string
      authentication_context:
        type: string
        nullable: true
  outcome:
    type: string
    enum: [GRANTED, DENIED]
  decision_reason:
    type: string
  authorization_id:
    type: string
    nullable: true
  authorization_policy:
    type: object
    required: [policy_id, policy_version]
    fields:
      policy_id:
        type: string
      policy_version:
        type: string
  artifact_version:
    type: string
  artifact_hash:
    type: string
