schema: hermes.execution_authorization_decision
schema_version: "1.0"
status: proposed
description: >-
  Immutable GRANTED/DENIED decision artifact (EA-1 domain model, amended by
  EA-3A). Binds cryptographically to the exact request via request_id /
  request_hash. Does not issue the referenced authorization. The authorization_id
  field is non-hash-bound forward linkage only (excluded from the canonical
  preimage) so the identity graph stays acyclic
  (Request -> Decision -> Authorization). Distinct from the other
  execution-authorization schemas.

required:
  - decision_id
  - request_id
  - request_hash
  - task_id
  - decision_actor
  - outcome
  - decision_reason
  - authorization_policy
  - artifact_version
  - artifact_hash

fields:
  decision_id:
    type: string
  request_id:
    type: string
  request_hash:
    type: string
    # 64-char lowercase hex SHA-256 of the exact immutable request artifact.
  task_id:
    type: string
  decision_actor:
    type: object
    required: [actor_id, actor_type, authority_role]
    fields:
      actor_id:
        type: string
      actor_type:
        type: string
        enum: [HUMAN, POLICY_SERVICE, SYSTEM]
      authority_role:
        type: string
      authentication_context:
        type: string
        nullable: true
  outcome:
    type: string
    enum: [GRANTED, DENIED]
  decision_reason:
    type: string
  authorization_id:
    type: string
    nullable: true
  authorization_policy:
    type: object
    required: [policy_id, policy_version]
    fields:
      policy_id:
        type: string
      policy_version:
        type: string
  artifact_version:
    type: string
  artifact_hash:
    type: string
